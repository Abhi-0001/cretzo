; =============================================================================
;  OPcache configuration for Cretzo
; =============================================================================
;
;  WHY
;  ---
;  OPcache was completely disabled - every opcache.* directive in the shipped
;  php.ini was commented out, and the extension itself was not even loaded.
;  Without it PHP re-reads, re-parses and re-compiles every executed file on
;  EVERY request. For this application that means, among others:
;
;      application/helpers/function_helper.php   11,600 lines
;      application/controllers/app/v1/Api.php     6,900 lines
;      application/models/Order_model.php         2,600 lines
;      ...plus the CodeIgniter core and all vendor code
;
;  Turning it on is the single highest value-to-risk change available: it does
;  not alter a line of application behaviour, it only stops PHP throwing away
;  its compilation work between requests.
;
;  HOW TO APPLY
;  ------------
;  Hostinger  : hPanel -> Advanced -> PHP Configuration -> PHP Options.
;               Enable "opcache", then set the values below under PHP Extensions
;               / custom ini where the panel allows it. Restart PHP afterwards.
;  cPanel     : MultiPHP INI Editor -> select domain -> Editor mode -> paste.
;  Docker/CLI : copy this file to the PHP conf.d directory, e.g.
;                   /usr/local/etc/php/conf.d/opcache.ini
;  XAMPP      : append to C:\xampp\php\php.ini, uncomment
;               `zend_extension=opcache`, restart Apache.
;
;  VERIFY
;  ------
;      php -r 'var_dump(opcache_get_status()["opcache_enabled"]);'
;  or add a temporary phpinfo() page and look for the "Zend OPcache" block.
; =============================================================================

; The extension itself. On Windows this is `zend_extension=php_opcache.dll`;
; on Linux builds the bare name resolves correctly.
zend_extension=opcache

[opcache]
opcache.enable=1

; Leave the CLI cache off. CLI processes are short-lived, so the cache is built
; and thrown away for no benefit, and it complicates migration/cron runs.
opcache.enable_cli=0

; Shared memory for compiled bytecode. The default 128 MB is adequate for this
; codebase; 192 leaves headroom for vendor growth. If opcache_get_status()
; reports cache_full = true, raise this.
opcache.memory_consumption=192

; Interned string buffer. The default 8 MB is small for an application with this
; many distinct class, method and string literals.
opcache.interned_strings_buffer=16

; Must exceed the number of PHP files that can be executed. This project has
; well over 1,000 once vendor/ is counted, and the default 10,000 is a prime-
; rounded ceiling - 20,000 gives comfortable headroom.
opcache.max_accelerated_files=20000

; ---------------------------------------------------------------------------
; DEPLOYMENT SAFETY - read before changing these two
; ---------------------------------------------------------------------------
; validate_timestamps=1 makes OPcache stat each file and recompile it when the
; mtime changes. revalidate_freq=2 means it does that check at most once every
; 2 seconds per file.
;
; This is the correct setting for this project because deployment is a git pull
; on the server: files change underneath a running PHP process with nothing
; resetting the cache. With validate_timestamps=0 you get slightly faster
; execution but the server keeps serving the PREVIOUS release until PHP is
; restarted - a genuinely confusing failure mode.
;
; Only set validate_timestamps=0 if the deploy process is changed to call
; opcache_reset() (or restart PHP-FPM) as its final step.
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; Keep docblocks. Some vendor libraries read annotations at runtime, and
; stripping comments to save a little memory is a poor trade against the risk.
opcache.save_comments=1

; Do not let OPcache intercept file_exists()/is_file() results. The application
; checks for uploaded files on disk (see get_image_url() and add_ver()), and
; cached stat results there would be wrong.
opcache.enable_file_override=0

; JIT is deliberately left OFF. It targets CPU-bound numeric code and gives
; effectively nothing to an I/O- and database-bound web application, while
; adding a class of hard-to-diagnose bugs. Not worth it here.
opcache.jit=off
opcache.jit_buffer_size=0
