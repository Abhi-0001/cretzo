name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: PHP syntax lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.0"

      - name: Lint every PHP file (fails on the first syntax error, with file:line)
        run: |
          set -e
          status=0
          while IFS= read -r -d '' f; do
            if ! php -l "$f" > /tmp/lint_out 2>&1; then
              echo "::error file=$f::$(tail -n1 /tmp/lint_out)"
              cat /tmp/lint_out
              status=1
            fi
          done < <(find . -path ./vendor -prune -o -path ./.git -prune -o -name '*.php' -print0)
          exit $status

  docker-boot-smoke-test:
    name: Docker build + boot smoke test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the app + db containers
        run: docker compose up -d --build

      - name: Wait for the app to accept connections (mirrors the cretzo.com outage check)
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/ || echo 000)
            echo "attempt $i: HTTP $code"
            if [ "$code" != "000" ]; then
              echo "Server responded with HTTP $code"
              exit 0
            fi
            sleep 2
          done
          echo "::error::App never accepted a connection on port 8090 after 60s"
          exit 1

      - name: Fetch homepage and check for PHP fatal errors
        run: |
          curl -s -o /tmp/home.html -w 'HTTP_STATUS:%{http_code}\n' http://localhost:8090/ | tee /tmp/status.txt
          echo "--- response body (first 200 lines) ---"
          head -n 200 /tmp/home.html
          if grep -qiE 'fatal error|parse error|uncaught (error|exception)' /tmp/home.html; then
            echo "::error::Homepage response contains a PHP fatal/parse error"
            exit 1
          fi

      - name: Show container logs (always, for debugging)
        if: always()
        run: docker compose logs --no-color

      - name: Show PHP/Apache error log inside the app container (always)
        if: always()
        run: docker compose exec -T app sh -c 'cat application/logs/log-$(date +%Y-%m-%d).php 2>/dev/null || echo "(no CodeIgniter log for today)"'

      - name: Tear down
        if: always()
        run: docker compose down -v
