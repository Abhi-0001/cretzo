name: CI

on:
  push:
  pull_request:

jobs:
  # ===========================================================================
  #  Secret scanning
  # ===========================================================================
  # This exists because a secret HAS already been committed here: the production
  # database password lived in application/config/database.php - a tracked, deployed
  # file - and the mobile API's JWT signing key and the Facebook app secret were
  # hardcoded in application/config/constants.php. All three are now read from the
  # environment via an untracked .env file, but nothing stopped the next one.
  #
  # Note that .gitignore could not have prevented it: database.php was ALREADY listed
  # in .gitignore and was committed anyway, because .gitignore has no effect on a file
  # that is already tracked. A check that fails the build is the only thing that
  # actually holds.
  #
  # Runs first and gates everything else - a build that publishes a credential should
  # not go green because the PHP happens to parse.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks compares commits, so it needs history rather than a shallow
          # clone. Without this it can only see the tip and misses a secret that was
          # added and then "removed" in a later commit - which is exactly the shape
          # of the problem here, since git history keeps the old value forever.
          fetch-depth: 0

      - name: Scan the working tree and full history for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  lint:
    name: PHP syntax lint
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.0"

      - name: Lint every PHP file (fails on the first syntax error, with file:line)
        run: |
          set -e
          status=0
          while IFS= read -r -d '' f; do
            if ! php -l "$f" > /tmp/lint_out 2>&1; then
              echo "::error file=$f::$(tail -n1 /tmp/lint_out)"
              cat /tmp/lint_out
              status=1
            fi
          done < <(find . -path ./vendor -prune -o -path ./.git -prune -o -name '*.php' -print0)
          exit $status

  docker-boot-smoke-test:
    name: Docker build + boot smoke test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      # The image build pulls from deb.debian.org and packagist; both reset
      # connections often enough to fail an otherwise-green run, so retry the
      # build itself before calling it a real failure.
      - name: Build the app image
        run: |
          # --progress=plain: the default (auto) collapses each step to a live-updating
          # summary, so a failure shows only BuildKit's "failed to solve" line plus the
          # Dockerfile source around it - the actual apt / configure error scrolls away
          # and never reaches the saved log. Plain keeps every line.
          for attempt in 1 2 3; do
            if docker compose build --progress=plain; then
              exit 0
            fi
            echo "::warning::Image build attempt $attempt failed (usually a package-mirror hiccup); retrying"
            sleep $((attempt * 10))
          done
          echo "::error::Image build failed 3 times — this is not a transient mirror error, check the log above"
          exit 1

      - name: Start the app + db containers
        run: docker compose up -d

      - name: Wait for the app to accept connections (mirrors the cretzo.com outage check)
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8090/ || echo 000)
            echo "attempt $i: HTTP $code"
            if [ "$code" != "000" ]; then
              echo "Server responded with HTTP $code"
              exit 0
            fi
            sleep 2
          done
          echo "::error::App never accepted a connection on port 8090 after 60s"
          exit 1

      - name: Fetch homepage and check for PHP fatal errors
        run: |
          curl -s -o /tmp/home.html -w 'HTTP_STATUS:%{http_code}\n' http://localhost:8090/ | tee /tmp/status.txt
          echo "--- response body (first 200 lines) ---"
          head -n 200 /tmp/home.html
          if grep -qiE 'fatal error|parse error|uncaught (error|exception)' /tmp/home.html; then
            echo "::error::Homepage response contains a PHP fatal/parse error"
            exit 1
          fi

      # Diagnostics only — never let them add a second red annotation on top of
      # the real failure (e.g. "service app is not running" after a build error).
      - name: Show container logs (always, for debugging)
        if: always()
        continue-on-error: true
        run: docker compose logs --no-color

      - name: Show PHP/Apache error log inside the app container (always)
        if: always()
        continue-on-error: true
        run: |
          if [ -n "$(docker compose ps -q app)" ]; then
            docker compose exec -T app sh -c 'cat application/logs/log-$(date +%Y-%m-%d).php 2>/dev/null || echo "(no CodeIgniter log for today)"'
          else
            echo "(app container never started — nothing to read)"
          fi

      - name: Tear down
        if: always()
        continue-on-error: true
        run: docker compose down -v
